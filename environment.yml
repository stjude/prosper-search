# PePath - Conda Environment
# 
# Create environment:
#   conda env create -f environment.yml
#
# Activate:
#   conda activate pepath
#
# Update:
#   conda env update -f environment.yml

name: pepath
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  # Python
  - python=3.10
  
  # PyTorch with CUDA
  - pytorch>=2.0.0
  - torchvision>=0.15.0
  - pytorch-cuda=12.1
  
  # Core scientific computing
  - numpy>=1.21.0
  - pandas>=1.5.0
  - scipy>=1.9.0
  - scikit-learn>=1.2.0
  
  # Image processing
  - pillow>=9.0.0
  - opencv>=4.7.0
  - openslide>=3.4.1
  - openslide-python>=1.2.0
  
  # Utilities
  - tqdm>=4.64.0
  - pyyaml>=6.0
  
  # Visualization
  - matplotlib>=3.6.0
  - seaborn>=0.12.0
  
  # Jupyter
  - jupyter>=1.0.0
  - jupyterlab>=3.5.0
  - ipykernel>=6.20.0
  - ipywidgets>=8.0.0
  
  # Development
  - pytest>=7.0.0
  - black>=23.0.0
  
  # Pip dependencies (not available in conda)
  - pip
  - pip:
    # Deep learning
    - timm>=0.9.0
    - huggingface-hub>=0.16.0
    - safetensors>=0.3.0
    
    # Optimal Transport
    - POT>=0.9.0
    
    # Graph analysis
    - networkx>=2.8.0
    
    # Binary arrays
    - bitarray>=2.6.0
    
    # Enhanced colormaps
    - colorcet>=3.0.0
